<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<script src="/js/error-guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Manage News — Admin</title>
<link rel="icon" href="/images/icon-192.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="admin">
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="brand"><span class="brand-mark"></span> PTI Sangrar</div>
    <nav class="admin-nav">
      <a href="/admin/dashboard.html">Dashboard</a>
      <a href="/admin/news-manage.html" class="active">News</a>
      <a href="/admin/gallery-manage.html">Gallery</a>
      <a href="/admin/submissions.html">Submissions</a>
      <a href="/index.html" target="_blank">View Site ↗</a>
    </nav>
    <button class="btn btn-outline btn-block logout" style="border-color:rgba(255,255,255,.25);color:#fff;" data-logout>Sign Out</button>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>News</h1>
      <span class="admin-user" data-admin-email></span>
    </div>

    <div class="admin-table-wrap" style="padding:24px;margin-bottom:28px;">
      <h3 id="formTitle">Add News</h3>
      <form id="newsForm" class="mt-16">
        <input type="hidden" id="editId">
        <div class="field-row">
          <div class="field"><label>Title</label><input type="text" name="title" required></div>
          <div class="field"><label>Category</label><input type="text" name="category" placeholder="e.g. Press Release"></div>
        </div>
        <div class="field"><label>Excerpt (short summary)</label><input type="text" name="excerpt"></div>
        <div class="field"><label>Body</label><textarea name="body" rows="6" required></textarea></div>
        <div class="field-row">
          <div class="field"><label>Image</label><input type="file" name="image" accept="image/*"></div>
          <div class="field">
            <label>Status</label>
            <select name="status">
              <option value="draft">Draft</option>
              <option value="published">Published</option>
            </select>
          </div>
        </div>
        <div style="display:flex;gap:10px;">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" id="cancelEdit" class="btn btn-ghost" style="display:none;">Cancel Edit</button>
        </div>
      </form>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr><th>Title</th><th>Category</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="newsList"></tbody>
      </table>
    </div>
  </main>
</div>

<script type="module">
  import { guardAdminPage, initLogoutButtons } from "./js/admin-auth.js";
  await guardAdminPage();
  initLogoutButtons();
</script>
<script type="module" src="/admin/js/admin-news.js"></script>
</body>
</html>
