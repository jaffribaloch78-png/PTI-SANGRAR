<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<script src="/js/error-guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Manage Gallery — Admin</title>
<link rel="icon" href="/images/icon-192.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="admin">
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="brand"><span class="brand-mark"></span> PTI Sangrar</div>
    <nav class="admin-nav">
      <a href="/admin/dashboard.html">Dashboard</a>
      <a href="/admin/news-manage.html">News</a>
      <a href="/admin/gallery-manage.html" class="active">Gallery</a>
      <a href="/admin/submissions.html">Submissions</a>
      <a href="/index.html" target="_blank">View Site ↗</a>
    </nav>
    <button class="btn btn-outline btn-block logout" style="border-color:rgba(255,255,255,.25);color:#fff;" data-logout>Sign Out</button>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Gallery</h1>
      <span class="admin-user" data-admin-email></span>
    </div>

    <div class="admin-table-wrap" style="padding:24px;margin-bottom:28px;">
      <h3>Upload Photo</h3>
      <form id="uploadForm" class="mt-16">
        <div class="field-row">
          <div class="field"><label>Image</label><input type="file" name="image" accept="image/*" required></div>
          <div class="field"><label>Caption</label><input type="text" name="caption"></div>
        </div>
        <button type="submit" class="btn btn-primary">Upload</button>
      </form>
    </div>

    <div class="grid grid-3" id="adminGalleryGrid"></div>
  </main>
</div>

<script type="module">
  import { guardAdminPage, initLogoutButtons } from "./js/admin-auth.js";
  await guardAdminPage();
  initLogoutButtons();
</script>
<script type="module" src="/admin/js/admin-gallery.js"></script>
</body>
</html>
