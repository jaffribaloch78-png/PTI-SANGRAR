name: Gemini AI Developer Automation

on:
  workflow_dispatch:
  issues:
    types: [opened, labeled]

jobs:
  ai-developer:
    if: contains(github.event.issue.labels.*.name, 'ai-fix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google GenAI Library
        run: pip install google-generativeai

      - name: Run Gemini Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          cat << 'EOF' > run_ai.py
          import os
          import google.generativeai as genai

          genai.configure(api_key=os.environ["GEMINI_API_KEY"])
          model = genai.GenerativeModel('gemini-1.5-flash')

          prompt = f"""You are an automated developer. 
          Task: {os.environ['ISSUE_TITLE']}
          Details: {os.environ['ISSUE_BODY']}
          Generate or edit the required code output directly."""

          response = model.generate_content(prompt)
          
          with open("ai_generated_code.py", "w") as f:
              f.write(response.text)
          EOF
          python run_ai.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Gemini Bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-generated updates via Gemini AI"
          git push
