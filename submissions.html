<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<script src="/js/error-guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Submissions — Admin</title>
<link rel="icon" href="/images/icon-192.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="admin">
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="brand"><span class="brand-mark"></span> PTI Sangrar</div>
    <nav class="admin-nav">
      <a href="/admin/dashboard.html">Dashboard</a>
      <a href="/admin/news-manage.html">News</a>
      <a href="/admin/gallery-manage.html">Gallery</a>
      <a href="/admin/submissions.html" class="active">Submissions</a>
      <a href="/index.html" target="_blank">View Site ↗</a>
    </nav>
    <button class="btn btn-outline btn-block logout" style="border-color:rgba(255,255,255,.25);color:#fff;" data-logout>Sign Out</button>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Submissions</h1>
      <span class="admin-user" data-admin-email></span>
    </div>

    <div class="admin-toolbar">
      <div class="lang-switch" style="background:var(--paper-dim);">
        <button data-tab="complaints" class="active">Complaints</button>
        <button data-tab="volunteers">Volunteers</button>
        <button data-tab="members">Members</button>
        <button data-tab="messages">Messages</button>
      </div>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr id="subHead"></tr></thead>
        <tbody id="subList"></tbody>
      </table>
    </div>
  </main>
</div>

<script type="module">
  import { guardAdminPage, initLogoutButtons } from "./js/admin-auth.js";
  await guardAdminPage();
  initLogoutButtons();
</script>
<script type="module" src="/admin/js/admin-submissions.js"></script>
</body>
</html>
